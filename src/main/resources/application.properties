spring.application.name=tomato-backend

# ---- MongoDB Atlas connection (set MONGODB_URI as an environment variable on Render) ----
# Example: mongodb+srv://<username>:<password>@cluster0.xxxxx.mongodb.net/tomatodb?retryWrites=true&w=majority
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tomatodb}

# ---- Server port (Render injects PORT automatically) ----
server.port=${PORT:8080}

# ---- JWT ----
jwt.secret=${JWT_SECRET:changeThisSecretKeyToSomethingLongAndRandomInProduction123456}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS allowed origin (your Netlify frontend) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://venerable-starlight-f1f219.netlify.app,http://localhost:3000,http://localhost:3001,http://localhost:5173}

# ---- Logging ----
logging.level.org.springframework.security=INFO

# ---- Stripe ----
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_51PqOsgRxVlY5mX9B0H0H0H0H0H0H0H0H0H0H0H0H0H0H0H0H0H0H0H0H0H0H0H0H0H0H0H0H0H0H0H0H}
